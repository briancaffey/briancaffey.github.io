name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Lint commit messages
        run: yarn commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      # `nuxi generate` writes .nuxt/eslint.config.mjs, which the lint config imports.
      - run: yarn generate
      - run: yarn lint

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      - run: yarn test:e2e

      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Builds the base branch and the PR, screenshots both with the PR's tests,
  # and uploads the comparison. Informational: layout changes are often intended.
  visual-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Build base branch
        run: |
          git worktree add ../base "${{ github.event.pull_request.base.sha }}"
          cd ../base
          yarn install --frozen-lockfile
          yarn generate

      - name: Build pull request
        run: |
          yarn install --frozen-lockfile
          yarn generate

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: Record baseline from base branch
        run: yarn test:visual --update-snapshots
        env:
          SITE_DIR: ../base/.output/public

      - name: Compare pull request against baseline
        id: compare
        continue-on-error: true
        run: yarn test:visual

      - name: Summarize
        run: |
          if [ "${{ steps.compare.outcome }}" = "success" ]; then
            echo "No visual differences from the base branch." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Screenshots differ from the base branch. Download the \`visual-diff-report\` artifact to review them. This does not block the pull request." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: visual-diff-report
          path: playwright-report
          retention-days: 7
